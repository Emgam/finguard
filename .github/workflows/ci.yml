# FinGuard CI: runs on every push and pull request.
# Tests that need the Kaggle data, the trained artifacts or the downloaded corpus are skipped
# automatically; the synthetic tests cover leakage rules, features, novelty flags, metrics,
# reasons, the entity store and the whole retrieval pipeline.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src tests tools
      - run: python -m pytest -q
